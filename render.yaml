# render.yaml — Infrastructure-as-Code for Render.com
#
# HOW TO USE:
#   1. Push this repo to GitHub (must be public or you've connected a private repo in Render).
#   2. Go to render.com → New → Blueprint → point at this repo.
#   3. Render reads this file and creates the service automatically.
#   4. Fill in all env vars marked "sync: false" in the Render dashboard
#      (these are secrets — never commit real values to this file).
#
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: agentops-studio-backend
    runtime: node
    region: singapore           # closest to India; change to oregon/ohio if latency is better
    plan: free                  # change to starter ($7/mo) for always-on (no cold starts)

    # ── Build ────────────────────────────────────────────────────────────────
    rootDir: backend
    buildCommand: npm ci --include=dev && npm run build
    startCommand: node dist/index.js

    # ── Health check (Render uses this to confirm service is up) ─────────────
    healthCheckPath: /health

    # ── Auto-deploy on push to main ──────────────────────────────────────────
    autoDeploy: true

    # ── Environment variables ─────────────────────────────────────────────────
    # sync: false  = secret — set value in Render dashboard, never committed here
    # sync: true   = non-secret — value is committed in this file
    envVars:

      # ── Node ──────────────────────────────────────────────────────────────
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3001"

      # ── Database (set in Render dashboard) ────────────────────────────────
      - key: MONGODB_URI
        sync: false               # MongoDB Atlas connection string
      - key: REDIS_URL
        sync: false               # Redis Cloud URL (redis://:<pass>@<host>:<port>)

      # ── Auth secrets (set in Render dashboard) ────────────────────────────
      - key: JWT_ACCESS_SECRET
        sync: false               # min 32 random chars — generate: openssl rand -hex 32
      - key: JWT_REFRESH_SECRET
        sync: false               # different from JWT_ACCESS_SECRET
      - key: JWT_ACCESS_EXPIRES_IN
        value: "15m"
      - key: SA_JWT_SECRET
        sync: false               # super-admin JWT secret (min 32 chars)
      - key: JWT_REFRESH_EXPIRES_IN
        value: "7d"

      # ── Frontend URL (update once your frontend is deployed) ──────────────
      - key: CLIENT_URL
        value: https://agentops-studio.vercel.app   # change to your real Vercel URL

      # ── Email — Resend (set in Render dashboard) ──────────────────────────
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: noreply@agentops.studio              # change to your verified sender domain

      # ── AI providers (set in Render dashboard) ────────────────────────────
      - key: OPENAI_API_KEY
        sync: false
      - key: DEEPGRAM_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: LLM_MODEL
        value: "gpt-4o-mini"        # gpt-4.1-mini | gemini-2.5-flash | gpt-4o (legacy)
      - key: TELEPHONY_COST_PER_MIN_USD
        value: "0.0047"             # Vobiz ₹0.45/min at ₹96.77/$1 — set from the Vobiz invoice
      - key: USD_INR_RATE
        value: "96.77"              # super-admin margin page: INR plan revenue → USD

      # ── Vapi (set in Render dashboard) ────────────────────────────────────
      - key: VAPI_API_KEY
        sync: false
      - key: VAPI_PUBLIC_KEY
        sync: false
      - key: VAPI_WEBHOOK_SECRET
        sync: false               # from Vapi Dashboard → Webhooks → secret
      - key: VAPI_TOOL_WEBHOOK_SECRET
        sync: false               # the shared secret for x-webhook-secret header on tool calls
      - key: VAPI_TOOL_ID_END_CALL
        sync: false               # populate after creating the tool in Vapi
      - key: VAPI_TOOL_ID_SUBMIT_ORDER
        sync: false               # populate after Composer creates the submit_order tool
      - key: VAPI_STRUCTURED_OUTPUT_ID
        sync: false               # electrical-shop-call-summary schema ID

      # ── Keep-alive self-ping (free plan only; RENDER_EXTERNAL_URL is auto-set) ──
      - key: KEEP_ALIVE_ENABLED
        value: "true"               # set "false" after upgrading to an always-on plan
      - key: KEEP_ALIVE_INTERVAL_MINUTES
        value: "10"

      # ── Telephony — Vobiz (optional, set when ready) ──────────────────────
      - key: VOBIZ_SIP_DOMAIN
        sync: false
      - key: VOBIZ_AUTH_USERNAME
        sync: false
      - key: VOBIZ_AUTH_PASSWORD
        sync: false
      - key: VOBIZ_VAPI_CREDENTIAL_ID
        sync: false               # outbound byo-sip-trunk credential in Vapi
      - key: VOBIZ_VAPI_INBOUND_CREDENTIAL_ID
        sync: false               # inbound byo-sip-trunk credential in Vapi
      - key: VOBIZ_AUTH_ID
        sync: false               # Vobiz REST API Auth ID (MA_...) — number picker
      - key: VOBIZ_AUTH_TOKEN
        sync: false
      - key: VOBIZ_GATEWAY_IP
        sync: false
      - key: VOBIZ_PHONE_NUMBER
        sync: false

      # ── Telephony — Exotel fallback (optional) ────────────────────────────
      - key: EXOTEL_API_KEY
        sync: false
      - key: EXOTEL_API_TOKEN
        sync: false
      - key: EXOTEL_SID
        sync: false
      - key: EXOTEL_CONNECTOR_URL
        sync: false

      # ── Stripe (leave blank until billing is wired for prod) ─────────────
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_STARTER_PRICE_ID
        sync: false
      - key: STRIPE_GROWTH_PRICE_ID
        sync: false
      - key: STRIPE_STARTER_PRICE_ID_INR
        sync: false
      - key: STRIPE_GROWTH_PRICE_ID_INR
        sync: false
      - key: STRIPE_PRO_PRICE_ID
        sync: false
      - key: STRIPE_PRO_PRICE_ID_INR
        sync: false
      - key: STRIPE_PREMIUM_VOICES_BASIC_PRICE_ID_INR
        sync: false
      - key: STRIPE_PREMIUM_VOICES_STANDARD_PRICE_ID_INR
        sync: false
      # Pricing v2 (2026-10-08) — scripts/create-pricing-v2-prices.ts
      - key: STRIPE_LITE_PRICE_ID_INR
        sync: false
      - key: STRIPE_PREMIUM_VOICES_LITE_PRICE_ID_INR
        sync: false
      - key: STRIPE_LITE_ANNUAL_PRICE_ID_INR
        sync: false
      - key: STRIPE_STARTER_ANNUAL_PRICE_ID_INR
        sync: false
      - key: STRIPE_GROWTH_ANNUAL_PRICE_ID_INR
        sync: false
      - key: STRIPE_PRO_ANNUAL_PRICE_ID_INR
        sync: false
      - key: STRIPE_SETUP_GUIDED_PRICE_ID_INR
        sync: false
      - key: STRIPE_SETUP_MANAGED_PRICE_ID_INR
        sync: false
      - key: STRIPE_TOPUP_100_PRICE_ID_INR
        sync: false
      - key: STRIPE_TOPUP_500_PRICE_ID_INR
        sync: false
